<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10120f" />
    <title>Offline | Alemu Kelemework</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #10120f; color: #f2f4ed; font-family: Arial, Helvetica, sans-serif; }
      main { width: min(100%, 560px); border: 1px solid rgba(200, 241, 105, .3); padding: clamp(28px, 7vw, 56px); }
      p { color: #a5ad9e; font-size: 14px; line-height: 1.7; }
      .label { color: #c8f169; font: 11px monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 20px 0 14px; font-size: clamp(36px, 9vw, 60px); line-height: .98; letter-spacing: -.05em; }
      a { display: inline-block; margin-top: 18px; padding: 13px 16px; background: #c8f169; color: #10120f; font-size: 13px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">Connection interrupted</span>
      <h1>Portfolio saved on this device.</h1>
      <p>Reconnect to send a message, sign in, or use the admin dashboard.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
